name: check

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check.py --self-test
      - run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
